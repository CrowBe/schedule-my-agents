name: Cloudflare dispatcher
on:
  push:
    paths: ['dispatcher/**', 'shared/**', 'lib/calendar/callback-*.ts', 'package.json', 'package-lock.json', '.github/workflows/dispatcher.yml']
  pull_request:
    paths: ['dispatcher/**', 'shared/**', 'lib/calendar/callback-*.ts', 'package.json', 'package-lock.json', '.github/workflows/dispatcher.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified dispatcher build
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  dispatcher:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dispatcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dispatcher/package-lock.json
      # The fixed diagnostic reuses the canonical address policy and socket
      # helpers. Their locked dependency resolves from the repository root.
      - run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Deploy explicitly requested build
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx cf deploy --prebuilt
